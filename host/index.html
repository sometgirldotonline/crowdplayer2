<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crowdplayer</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,100,1,200&icon_names=favorite,home,search,settings" rel="stylesheet" />

</head>

<body>
    <div class="navbar bg-base-100 shadow-sm">
        <div class="flex-1">
            <a class="btn btn-ghost text-xl">daisyUI</a>
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal px-1">
                <li><button class="btn btn-error btn-soft">End Party</button></li>
            </ul>
        </div>
    </div>
    <div class="page-setup">
        <div class="hero bg-base-200 min-h-screen">
            <div class="hero-content text-center max-w-lg">
                <div class="max-w-lg justify-center">
                    <h1 class="text-5xl font-bold">Let's get the party started!</h1>
                    <p class="py-6">
                        But first, some setup:
                    </p>
                    <div class="flex flex-col md:flex-row gap-5 justify-center w-full">
                        <div class="card bg-base-100 w-full shadow-sm">
                            <div class="card-body">
                                <h2 class="text-2xl font-bold text-center">Your files?</h2>
                                <p>Please select your music folder. Crowdplayer accepts all common music file types<br><b>Examples: </b>mp3, m4a, aac, wav, flac, ogg*, opus, webm<br><small>* no Ogg support on Apple Safari</small><br><br><i>all your music are belong to us /silly</i></p>
                                <div class="card-actions justify-end">
                                    <button id="enter-host" class="btn btn-primary w-full">Enter</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <br>
                    <button id="enter-party" class="btn btn-primary w-full">Continue </button>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
